name: Deploy to EC2

on:
  push:
    branches:
      - elastic-integration

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Lexplain_Final
            git pull origin elastic-integration
            pkill -f app.py || true
            nohup python app.py &
